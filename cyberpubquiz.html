<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpub Quiz - Security Awareness</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 50%, #0a0a0a 100%);
            color: #00ff41;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background grid */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(50px); }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #00ff41;
            border-radius: 50%;
            animation: float 15s infinite;
            opacity: 0.6;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); }
            50% { transform: translateY(-100vh) translateX(100px); }
        }

        .container {
            max-width: 800px;
            width: 90%;
            background: rgba(10, 10, 30, 0.85);
            border: 2px solid #00ff41;
            border-radius: 15px;
            padding: 50px;
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.3),
                inset 0 0 50px rgba(0, 255, 65, 0.05);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
        }

        .corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #ff00ff;
        }

        .corner.top-left {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .corner.top-right {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }

        .corner.bottom-left {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        .corner.bottom-right {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        h1 {
            font-size: 3em;
            text-align: center;
            margin-bottom: 20px;
            color: #00ff41;
            text-shadow: 
                0 0 10px #00ff41,
                0 0 20px #00ff41,
                0 0 30px #00ff41;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translateX(0); }
            92% { transform: translateX(-2px); }
            94% { transform: translateX(2px); }
            96% { transform: translateX(-2px); }
        }

        .subtitle {
            text-align: center;
            font-size: 1.2em;
            color: #ff00ff;
            margin-bottom: 40px;
            text-shadow: 0 0 10px #ff00ff;
        }

        .message {
            background: rgba(0, 255, 65, 0.05);
            border-left: 4px solid #00ff41;
            padding: 25px;
            margin: 30px 0;
            font-size: 1.1em;
            line-height: 1.8;
            color: #b8f3b8;
            border-radius: 5px;
        }

        .icons {
            display: flex;
            justify-content: space-around;
            margin: 40px 0;
            flex-wrap: wrap;
            gap: 20px;
        }

        .icon-item {
            text-align: center;
            color: #00ffff;
            font-size: 2em;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .icon-item:nth-child(2) {
            animation-delay: 0.3s;
        }

        .icon-item:nth-child(3) {
            animation-delay: 0.6s;
        }

        .cta-button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 40px auto 0;
            padding: 20px 40px;
            font-size: 1.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            color: #0a0a0a;
            background: linear-gradient(135deg, #00ff41 0%, #00ffff 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            box-shadow: 
                0 0 20px rgba(0, 255, 65, 0.5),
                0 5px 15px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 0 30px rgba(0, 255, 65, 0.8),
                0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .cta-button:hover::before {
            left: 100%;
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 2em;
            }

            .subtitle {
                font-size: 1em;
            }

            .message {
                font-size: 1em;
                padding: 20px;
            }

            .cta-button {
                font-size: 1.2em;
                padding: 15px 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Floating particles -->
    <script>
        for (let i = 0; i < 20; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            document.body.appendChild(particle);
        }
    </script>

    <div class="container">
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <h1>🔐 CYBERPUB QUIZ 🔐</h1>
        <div class="subtitle">/// SECURITY AWARENESS CHALLENGE ///</div>

        <div class="icons">
            <div class="icon-item">💻</div>
            <div class="icon-item">📱</div>
            <div class="icon-item">🛡️</div>
        </div>

        <div class="message">
            <strong>Leuk dat je de cyberpub quiz wilt doen.</strong><br><br>
            Deze quiz helpt je met de cybersecurity van je eigen apparaten (computer, laptop, smartphone).
        </div>

        <a href="https://strato.oiepoie.nl/EazyQuiz/index.html?quiz=https://raw.githubusercontent.com/beamzer/EazyQuiz/refs/heads/main/quiz-files/security-awareness.json&lang=nl" class="cta-button">
            START QUIZ →
        </a>
    </div>
</body>
</html>
